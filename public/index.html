<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #202124;
    --toolbar: #292a2d;
    --tab-bar: #1e1f23;
    --tab-active: #292a2d;
    --tab-inactive: #1e1f23;
    --tab-hover: #35363a;
    --border: #3c3f43;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --accent: #8ab4f8;
    --btn-hover: #35363a;
    --input-bg: #303134;
    --input-focus: #3c4043;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* TAB BAR */
  #tab-bar {
    background: var(--tab-bar);
    display: flex;
    align-items: flex-end;
    padding: 8px 8px 0;
    gap: 2px;
    min-height: 40px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  #tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px 8px 0 0;
    background: var(--tab-inactive);
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    min-width: 120px;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.1s;
    border: 1px solid transparent;
    border-bottom: none;
    flex-shrink: 0;
  }
  .tab:hover { background: var(--tab-hover); color: var(--text); }
  .tab.active {
    background: var(--tab-active);
    color: var(--text);
    border-color: var(--border);
    border-bottom-color: var(--tab-active);
  }
  .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tab-close {
    width: 16px; height: 16px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .tab-close:hover { background: #5f6368; color: var(--text); }

  #new-tab-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 18px;
    flex-shrink: 0;
    margin-bottom: 4px;
  }
  #new-tab-btn:hover { background: var(--btn-hover); color: var(--text); }

  /* TOOLBAR */
  #toolbar {
    background: var(--toolbar);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }

  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 16px;
    transition: background 0.1s, color 0.1s;
    flex-shrink: 0;
  }
  .nav-btn:hover { background: var(--btn-hover); color: var(--text); }
  .nav-btn.disabled { opacity: 0.35; cursor: default; pointer-events: none; }

  #address-bar {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid transparent;
    border-radius: 20px;
    padding: 6px 16px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: background 0.15s, border-color 0.15s;
  }
  #address-bar:focus {
    background: var(--input-focus);
    border-color: var(--accent);
  }
  #address-bar::placeholder { color: var(--text-dim); }

  /* CONTENT */
  #content-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .tab-content {
    position: absolute;
    inset: 0;
    display: none;
  }
  .tab-content.active { display: flex; flex-direction: column; }

  .home-page {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: var(--bg);
  }

  .home-search-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 560px;
    padding: 0 20px;
  }

  .home-title { font-size: 22px; font-weight: 400; color: var(--text-dim); }

  #home-search {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 12px 20px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #home-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(138,180,248,0.15);
  }
  #home-search::placeholder { color: var(--text-dim); }

  .home-search-btn {
    padding: 10px 24px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .home-search-btn:hover { background: var(--btn-hover); }

  .page-frame {
    flex: 1;
    border: none;
    width: 100%;
    background: #fff;
  }

  .loading-bar {
    height: 3px;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
    position: absolute;
    top: 0; left: 0;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="tab-bar">
  <div id="new-tab-btn" onclick="newTab()" title="New tab">+</div>
</div>

<div id="toolbar">
  <div class="nav-btn disabled" id="btn-back"    onclick="goBack()"    title="Back">&#8592;</div>
  <div class="nav-btn disabled" id="btn-forward" onclick="goForward()" title="Forward">&#8594;</div>
  <div class="nav-btn"          id="btn-refresh" onclick="refreshPage()" title="Refresh">&#8635;</div>
  <div class="nav-btn"          id="btn-home"    onclick="goHome()"    title="Home">&#8962;</div>
  <input id="address-bar" type="text" placeholder="Search or enter address..."
         onkeydown="if(event.key==='Enter') navigate(this.value)" />
</div>

<div id="content-area"></div>

<script>
  let tabs = [];
  let activeTabId = null;
  let tabCounter = 0;

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function generateId() { return 'tab' + (++tabCounter); }
  function getTab(id) { return tabs.find(t => t.id === id); }

  function newTab(url) {
    const id = generateId();
    tabs.push({ id, url: '', title: 'New tab', history: [], historyIndex: -1 });
    const container = document.createElement('div');
    container.className = 'tab-content';
    container.id = 'content-' + id;
    document.getElementById('content-area').appendChild(container);
    renderTabs();
    switchTab(id);
    if (url) loadUrl(id, url);
    return id;
  }

  function closeTab(id, e) {
    e && e.stopPropagation();
    const idx = tabs.findIndex(t => t.id === id);
    tabs = tabs.filter(t => t.id !== id);
    document.getElementById('content-' + id)?.remove();
    if (tabs.length === 0) { newTab(); return; }
    if (activeTabId === id) switchTab(tabs[Math.min(idx, tabs.length-1)].id);
    else renderTabs();
  }

  function switchTab(id) {
    activeTabId = id;
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById('content-' + id)?.classList.add('active');
    renderTabs();
    updateToolbar();
  }

  function renderTabs() {
    const bar = document.getElementById('tab-bar');
    bar.querySelectorAll('.tab').forEach(el => el.remove());
    const newBtn = document.getElementById('new-tab-btn');
    tabs.forEach(tab => {
      const el = document.createElement('div');
      el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
      el.innerHTML = `<span class="tab-title">${esc(tab.title)}</span><span class="tab-close" onclick="closeTab('${tab.id}',event)">&#x2715;</span>`;
      el.onclick = () => switchTab(tab.id);
      bar.insertBefore(el, newBtn);
    });
  }

  function buildProxyUrl(raw) {
    let url = raw.trim();
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      if (url.includes('.') && !url.includes(' ')) url = 'https://' + url;
      else url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
    }
    return '/proxy?url=' + encodeURIComponent(url);
  }

  function loadUrl(id, rawInput) {
    const tab = getTab(id);
    if (!tab) return;

    let url = rawInput.trim();
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      if (url.includes('.') && !url.includes(' ')) url = 'https://' + url;
      else url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
    }

    tab.url = url;
    tab.history = tab.history.slice(0, tab.historyIndex + 1);
    tab.history.push(url);
    tab.historyIndex = tab.history.length - 1;

    const container = document.getElementById('content-' + id);
    container.innerHTML = '';

    const loadingBar = document.createElement('div');
    loadingBar.className = 'loading-bar';
    container.appendChild(loadingBar);
    setTimeout(() => loadingBar.style.width = '70%', 50);

    const frame = document.createElement('iframe');
    frame.className = 'page-frame';
    frame.src = '/proxy?url=' + encodeURIComponent(url);
    frame.onload = () => {
      loadingBar.style.width = '100%';
      setTimeout(() => loadingBar.remove(), 300);
      try {
        const t = frame.contentDocument?.title;
        if (t) { tab.title = t; renderTabs(); }
        else { tab.title = new URL(url).hostname; renderTabs(); }
      } catch(e) {
        tab.title = new URL(url).hostname;
        renderTabs();
      }
    };
    container.appendChild(frame);

    if (id === activeTabId) {
      document.getElementById('address-bar').value = url;
    }

    updateToolbar();
  }

  function renderHome(id) {
    const tab = getTab(id);
    tab.url = '';
    const container = document.getElementById('content-' + id);
    container.innerHTML = `
      <div class="home-page">
        <div class="home-search-wrap">
          <div class="home-title">Where to?</div>
          <input id="home-search-${id}" type="text" class="home-search-input" placeholder="Search or enter a URL..."
                 onkeydown="if(event.key==='Enter'){loadUrl('${id}',this.value);}" />
          <div class="home-search-btn" onclick="loadUrl('${id}',document.getElementById('home-search-${id}').value)">Go</div>
        </div>
      </div>`;
    setTimeout(() => document.getElementById('home-search-' + id)?.focus(), 50);
  }

  function navigate(input) { if (activeTabId) loadUrl(activeTabId, input); }

  function goBack() {
    const tab = getTab(activeTabId);
    if (!tab || tab.historyIndex <= 0) return;
    tab.historyIndex--;
    tab.url = tab.history[tab.historyIndex];
    if (!tab.url) renderHome(activeTabId);
    else {
      const container = document.getElementById('content-' + activeTabId);
      container.innerHTML = '';
      const frame = document.createElement('iframe');
      frame.className = 'page-frame';
      frame.src = '/proxy?url=' + encodeURIComponent(tab.url);
      container.appendChild(frame);
    }
    updateToolbar();
  }

  function goForward() {
    const tab = getTab(activeTabId);
    if (!tab || tab.historyIndex >= tab.history.length - 1) return;
    tab.historyIndex++;
    tab.url = tab.history[tab.historyIndex];
    if (!tab.url) renderHome(activeTabId);
    else loadUrl(activeTabId, tab.url);
    updateToolbar();
  }

  function refreshPage() {
    const tab = getTab(activeTabId);
    if (!tab) return;
    if (!tab.url) renderHome(activeTabId);
    else loadUrl(activeTabId, tab.url);
  }

  function goHome() {
    const tab = getTab(activeTabId);
    if (!tab) return;
    tab.history.push('');
    tab.historyIndex = tab.history.length - 1;
    renderHome(activeTabId);
    document.getElementById('address-bar').value = '';
    updateToolbar();
  }

  function updateToolbar() {
    const tab = getTab(activeTabId);
    if (!tab) return;
    document.getElementById('address-bar').value = tab.url || '';
    document.getElementById('btn-back').classList.toggle('disabled', tab.historyIndex <= 0);
    document.getElementById('btn-forward').classList.toggle('disabled', tab.historyIndex >= tab.history.length - 1);
  }

  // Listen for navigation messages from proxied pages
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'navigate' && activeTabId) {
      loadUrl(activeTabId, e.data.url);
    }
  });

  // Boot
  newTab();
</script>
</body>
</html>
